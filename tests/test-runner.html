<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Test Suite — Portfolio NAV Tracker</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c1117;
      color: #eef2f6;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 920px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0; }
    .summary {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      background: #141c24;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .summary.pass { color: #10b981; border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.1); }
    .summary.fail { color: #f43f5e; border-color: rgba(244,63,94,0.4); background: rgba(244,63,94,0.1); }
    .suite {
      background: #141c24;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .suite-title {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 14px;
      font-size: 12.5px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .test-row:last-child { border-bottom: none; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .badge.pass { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge.fail { background: rgba(244,63,94,0.15); color: #f43f5e; }
    .err {
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #fda4af;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Unit Test Suite — Portfolio NAV Tracker (5 Core Seams)</h1>
        <div style="font-size:12px;color:#8e9ba8;margin-top:2px;">Browser-native ES Module runner • Zero build step</div>
      </div>
      <div id="test-summary" class="summary">Running tests...</div>
    </header>
    <main id="test-results"></main>
  </div>
  <script type="module" src="./core.test.js"></script>
</body>
</html>
